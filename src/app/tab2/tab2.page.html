<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Autenticación JWT - Tienda Online</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ion-padding" style="margin-top: 20px;">
    
    <div class="ion-text-center ion-margin-bottom">
      <ion-icon name="person-circle-outline" style="font-size: 80px; color: var(--ion-color-primary);"></ion-icon>
      <h2>Iniciar Sesión</h2>
      <p>Accede para gestionar tu carrito de compras y pedidos</p>
    </div>

    <!-- Formulario de Credenciales Obligatorio por la Guía -->
    <ion-item class="ion-margin-bottom">
      <ion-input label="Usuario / Correo" labelPlacement="floating" type="email" placeholder="ejemplo@ucompensar.edu.co"></ion-input>
    </ion-item>

    <ion-item class="ion-margin-bottom">
      <ion-input label="Contraseña" labelPlacement="floating" type="password" placeholder="********"></ion-input>
    </ion-item>

    <!-- Botón de Envío e Interacción -->
    <ion-button expand="block" class="ion-margin-top" color="primary">
      <ion-icon name="log-in-outline" slot="start"></ion-icon>
      Ingresar (Generar Token JWT)
    </ion-button>

  </div>
</ion-content>
